name: Helix-Lock AIRP tests

on:
  push:
    paths:
      - "helix_pro/**"
      - "helix_pro_gui.py"
      - "helix_lock_app.py"
      - "airp_fingerprint_gui.py"
      - "experiments/timdr_benchmark.py"
      - "experiments/three_loop_phase_memory.py"
      - "experiments/three_loop_information_retention.py"
      - "experiments/helical_tunnel_chirality.py"
      - "experiments/chirality_resolving_operator.py"
      - "experiments/helix_chiral_memory_retention.py"
      - "experiments/helix_chiral_memory_reversal.py"
      - "tests/test_helix_pro.py"
      - "tests/test_helix_pro_gui.py"
      - "tests/test_adaptive_rotation.py"
      - "tests/test_airp_monitor.py"
      - "tests/test_airp_store.py"
      - "tests/test_airp_transaction.py"
      - "tests/test_airp_ledger.py"
      - "tests/test_airp_recovery.py"
      - "tests/test_airp_anchor_service.py"
      - "tests/test_airp_quorum.py"
      - "tests/test_airp_key_fingerprint.py"
      - "tests/test_airp_identity.py"
      - "tests/test_timdr_adapter.py"
      - "tests/test_timdr_benchmark.py"
      - "tests/test_airp_history_memory.py"
      - "tests/test_three_loop_phase_memory.py"
      - "tests/test_three_loop_information_retention.py"
      - "tests/test_helical_tunnel_chirality.py"
      - "tests/test_chirality_resolving_operator.py"
      - "tests/test_helix_chiral_memory_retention.py"
      - "tests/test_helix_chiral_memory_reversal.py"
      - ".github/workflows/airp-tests.yml"
  pull_request:
    paths:
      - "helix_pro/**"
      - "helix_pro_gui.py"
      - "helix_lock_app.py"
      - "airp_fingerprint_gui.py"
      - "experiments/timdr_benchmark.py"
      - "tests/test_helix_pro.py"
      - "tests/test_helix_pro_gui.py"
      - "tests/test_adaptive_rotation.py"
      - "tests/test_airp_monitor.py"
      - "tests/test_airp_store.py"
      - "tests/test_airp_transaction.py"
      - "tests/test_airp_ledger.py"
      - "tests/test_airp_recovery.py"
      - "tests/test_airp_anchor_service.py"
      - "tests/test_airp_quorum.py"
      - "tests/test_airp_key_fingerprint.py"
      - "tests/test_airp_identity.py"
      - "tests/test_timdr_adapter.py"
      - "tests/test_timdr_benchmark.py"
      - "experiments/three_loop_phase_memory.py"
      - "experiments/three_loop_information_retention.py"
      - "experiments/helical_tunnel_chirality.py"
      - "experiments/chirality_resolving_operator.py"
      - "tests/test_airp_history_memory.py"
      - "tests/test_three_loop_phase_memory.py"
      - "tests/test_three_loop_information_retention.py"
      - "tests/test_helical_tunnel_chirality.py"
      - "tests/test_chirality_resolving_operator.py"
      - ".github/workflows/airp-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip cryptography pytest numpy
      - name: Run reproducible synthetic TIMDR benchmark
        run: python experiments/timdr_benchmark.py --output timdr-benchmark.json
      - name: Run three-loop information-retention experiment
        run: python experiments/three_loop_information_retention.py --output three-loop-information-retention.json
      - name: Run helical tunnel chirality experiment
        run: python experiments/helical_tunnel_chirality.py --output helical-tunnel-chirality.json
      - name: Run helix chiral-memory reversal experiment
        run: python -m experiments.helix_chiral_memory_reversal --output helix-chiral-memory-reversal.json
      - name: Upload helix chiral-memory reversal report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-memory-reversal-${{ matrix.python-version }}
          path: helix-chiral-memory-reversal.json
          retention-days: 30
      - name: Run helix chiral-memory retention experiment
        run: python -m experiments.helix_chiral_memory_retention --output helix-chiral-memory-retention.json
      - name: Upload helix chiral-memory retention report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-memory-retention-${{ matrix.python-version }}
          path: helix-chiral-memory-retention.json
          retention-days: 30
      - name: Run chirality-resolving operator experiment
        run: python -m experiments.chirality_resolving_operator --output chirality-resolving-operator.json
      - name: Upload chirality-resolving operator report
        uses: actions/upload-artifact@v4
        with:
          name: chirality-resolving-operator-${{ matrix.python-version }}
          path: chirality-resolving-operator.json
          retention-days: 30
      - name: Upload helical tunnel chirality report
        uses: actions/upload-artifact@v4
        with:
          name: helical-tunnel-chirality-${{ matrix.python-version }}
          path: helical-tunnel-chirality.json
          retention-days: 30
      - name: Upload three-loop experiment report
        uses: actions/upload-artifact@v4
        with:
          name: three-loop-information-retention-${{ matrix.python-version }}
          path: three-loop-information-retention.json
          retention-days: 30
      - name: Upload synthetic benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: timdr-synthetic-benchmark-${{ matrix.python-version }}
          path: timdr-benchmark.json
          retention-days: 30
      - name: Run core and AIRP tests
        run: >-
          python -m pytest -q
          tests/test_helix_pro.py
          tests/test_helix_pro_gui.py
          tests/test_adaptive_rotation.py
          tests/test_airp_monitor.py
          tests/test_airp_store.py
          tests/test_airp_transaction.py
          tests/test_airp_ledger.py
          tests/test_airp_recovery.py
          tests/test_airp_anchor_service.py
          tests/test_airp_quorum.py
          tests/test_airp_key_fingerprint.py
          tests/test_airp_identity.py
          tests/test_timdr_adapter.py
          tests/test_timdr_benchmark.py
          tests/test_airp_history_memory.py
          tests/test_three_loop_phase_memory.py
          tests/test_three_loop_information_retention.py
          tests/test_helical_tunnel_chirality.py
          tests/test_chirality_resolving_operator.py
          tests/test_helix_chiral_memory_retention.py
          tests/test_helix_chiral_memory_reversal.py

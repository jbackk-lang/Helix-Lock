      - "tests/test_chirality_resolving_operator.py"
      - ".github/workflows/airp-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip cryptography pytest numpy
      - name: Verify release blocker counterexamples
        run: python -m pytest -q tests/test_helix_release_blockers.py
      - name: Test correlated reflection stress scenarios
        run: python -m pytest -q tests/test_helix_reflection_stress.py
      - name: Test quorum-based symbol consensus
        run: python -m pytest -q tests/test_helix_symbol_consensus.py
      - name: Test phase coherence adaptive estimator
        run: python -m pytest -q tests/test_helix_phase_coherence.py
      - name: Test fail-closed replay recovery classification
        run: python -m pytest -q tests/test_helix_replay_recovery.py
      - name: Test concurrent guarded replay and unavailable trust
        run: python -m pytest -q tests/test_helix_guarded_replay_adversarial.py
      - name: Test fail-closed replay admission and checkpoint failure
        run: python -m pytest -q tests/test_helix_guarded_replay_receiver.py
      - name: Test trusted replay-state checkpoint and rollback detection
        run: python -m pytest -q tests/test_helix_replay_state_checkpoint.py
      - name: Test adversarial replay and concurrency behavior
        run: python -m pytest -q -rx tests/test_helix_replay_adversarial.py
      - name: Test persistent replay guard
        run: python -m pytest -q tests/test_helix_native_replay_guard.py
      - name: Test authenticated-envelope security regression
        run: python -m pytest -q tests/test_helix_security_performance_gate.py tests/test_helix_native_secure_envelope.py
      - name: Measure authenticated-envelope security and throughput
        run: python -m experiments.helix_security_performance_gate --output helix-security-performance.json
      - name: Upload security-performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: helix-security-performance-${{ matrix.python-version }}
          path: helix-security-performance.json
          retention-days: 30
      - name: Test robust resonance filter
        run: python -m pytest -q tests/test_helix_resonance_filter.py
      - name: Compare resonance filter with circular mean
        run: python -m experiments.helix_resonance_filter --output helix-resonance-filter.json
      - name: Upload resonance-filter measurements
        uses: actions/upload-artifact@v4
        with:
          name: helix-resonance-filter-${{ matrix.python-version }}
          path: helix-resonance-filter.json
          retention-days: 30
      - name: Test repeated same-symbol observations
        run: python -m pytest -q tests/test_helix_qpsk_repeated_observations.py
      - name: Measure repeated same-symbol recovery and cost
        run: python -m experiments.helix_qpsk_repeated_observations --output helix-qpsk-repeated-observations.json
      - name: Upload repeated-observation benchmark
        uses: actions/upload-artifact@v4
        with:
          name: helix-qpsk-repeated-observations-${{ matrix.python-version }}
          path: helix-qpsk-repeated-observations.json
          retention-days: 30
      - name: Test QPSK symbol and file recovery
        run: python -m pytest -q tests/test_helix_qpsk_memory_benchmark.py
      - name: Measure QPSK recovery versus temporal memory
        run: python -m experiments.helix_qpsk_memory_benchmark --output helix-qpsk-memory-benchmark.json
      - name: Upload QPSK memory benchmark
        uses: actions/upload-artifact@v4
        with:
          name: helix-qpsk-memory-benchmark-${{ matrix.python-version }}
          path: helix-qpsk-memory-benchmark.json
          retention-days: 30
      - name: Test memory versus cumulative errors
        run: python -m pytest -q tests/test_helix_memory_vs_accumulation.py
      - name: Measure per-observation errors, sequence failures, runtime and RAM
        run: python -m experiments.helix_memory_vs_accumulation --output helix-memory-vs-accumulation.json
      - name: Upload memory and accumulation measurements
        uses: actions/upload-artifact@v4
        with:
          name: helix-memory-vs-accumulation-${{ matrix.python-version }}
          path: helix-memory-vs-accumulation.json
          retention-days: 30
      - name: Run reproducible synthetic TIMDR benchmark
        run: python experiments/timdr_benchmark.py --output timdr-benchmark.json
      - name: Run three-loop information-retention experiment
        run: python experiments/three_loop_information_retention.py --output three-loop-information-retention.json
      - name: Run helical tunnel chirality experiment
        run: python experiments/helical_tunnel_chirality.py --output helical-tunnel-chirality.json
      - name: Run channel phase drift and reflection experiment
        run: python -m experiments.helix_chiral_signal_channel --output helix-chiral-signal-channel.json
      - name: Upload channel controls report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-signal-channel-${{ matrix.python-version }}
          path: helix-chiral-signal-channel.json
          retention-days: 30
      - name: Run synthetic helical signal experiment
        run: python -m experiments.helix_chiral_signal --output helix-chiral-signal.json
      - name: Upload helical signal report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-signal-${{ matrix.python-version }}
          path: helix-chiral-signal.json
          retention-days: 30
      - name: Infer chirality from phase history
        run: python -m experiments.helix_chiral_memory_inference --output helix-chiral-memory-inference.json
      - name: Upload chirality inference report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-memory-inference-${{ matrix.python-version }}
          path: helix-chiral-memory-inference.json
          retention-days: 30
      - name: Run helix chiral-memory reversal experiment
        run: python -m experiments.helix_chiral_memory_reversal --output helix-chiral-memory-reversal.json
      - name: Upload helix chiral-memory reversal report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-memory-reversal-${{ matrix.python-version }}
          path: helix-chiral-memory-reversal.json
          retention-days: 30
      - name: Run helix chiral-memory retention experiment
        run: python -m experiments.helix_chiral_memory_retention --output helix-chiral-memory-retention.json
      - name: Upload helix chiral-memory retention report
        uses: actions/upload-artifact@v4
        with:
          name: helix-chiral-memory-retention-${{ matrix.python-version }}
          path: helix-chiral-memory-retention.json
          retention-days: 30
      - name: Run chirality-resolving operator experiment
        run: python -m experiments.chirality_resolving_operator --output chirality-resolving-operator.json
      - name: Upload chirality-resolving operator report
        uses: actions/upload-artifact@v4
        with:
          name: chirality-resolving-operator-${{ matrix.python-version }}
          path: chirality-resolving-operator.json
          retention-days: 30
      - name: Upload helical tunnel chirality report
        uses: actions/upload-artifact@v4
        with:
          name: helical-tunnel-chirality-${{ matrix.python-version }}
          path: helical-tunnel-chirality.json
          retention-days: 30
      - name: Upload three-loop experiment report
        uses: actions/upload-artifact@v4
        with:
          name: three-loop-information-retention-${{ matrix.python-version }}
          path: three-loop-information-retention.json
          retention-days: 30
      - name: Upload synthetic benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: timdr-synthetic-benchmark-${{ matrix.python-version }}
          path: timdr-benchmark.json
          retention-days: 30
      - name: Benchmark Helix Native real-byte codec
        run: python -m experiments.helix_native_benchmark --output helix-native-benchmark.json
      - name: Upload Helix Native benchmark
        uses: actions/upload-artifact@v4
        with:
          name: helix-native-benchmark-${{ matrix.python-version }}
          path: helix-native-benchmark.json
          retention-days: 30
      - name: Compare history-aware and instantaneous decoding
        run: python -m experiments.helix_native_history_comparison --output helix-native-history-comparison.json
      - name: Upload history comparison
        uses: actions/upload-artifact@v4
        with:
          name: helix-native-history-${{ matrix.python-version }}
          path: helix-native-history-comparison.json
          retention-days: 30
      - name: Evaluate history evidence across noise regimes
        run: python -m experiments.helix_native_evidence_gate --output helix-native-evidence-gate.json
      - name: Upload evidence gate report
        uses: actions/upload-artifact@v4
        with:
          name: helix-native-evidence-gate-${{ matrix.python-version }}
          path: helix-native-evidence-gate.json
          retention-days: 30
      - name: Run core and AIRP tests
        run: >-
          python -m pytest -q
          tests/test_helix_pro.py
          tests/test_helix_pro_gui.py
          tests/test_adaptive_rotation.py
          tests/test_airp_monitor.py
          tests/test_airp_store.py
          tests/test_airp_transaction.py
          tests/test_airp_ledger.py
          tests/test_airp_recovery.py
          tests/test_airp_anchor_service.py
          tests/test_airp_quorum.py
          tests/test_airp_key_fingerprint.py
          tests/test_airp_identity.py
          tests/test_timdr_adapter.py
          tests/test_timdr_benchmark.py
          tests/test_airp_history_memory.py
          tests/test_three_loop_phase_memory.py
          tests/test_three_loop_information_retention.py
          tests/test_helical_tunnel_chirality.py
          tests/test_chirality_resolving_operator.py
          tests/test_helix_chiral_memory_retention.py
          tests/test_helix_chiral_memory_reversal.py
          tests/test_helix_chiral_memory_inference.py
          tests/test_helix_chiral_signal.py
          tests/test_helix_chiral_signal_channel.py
          tests/test_helix_chiral_intelligence.py
          tests/test_helix_native_codec.py
          tests/test_helix_native_benchmark.py
          tests/test_helix_native_compact.py
          tests/test_helix_native_history_comparison.py
          tests/test_helix_native_evidence_gate.py
          tests/test_helix_native_secure_envelope.py
          tests/test_helix_lock_ui_priority.py

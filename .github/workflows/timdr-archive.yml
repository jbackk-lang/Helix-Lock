name: TIMDR archive integration tests
on:
  push:
    paths:
      - "helix_pro/timdr_archive_*.py"
      - "tests/test_timdr_archive_*.py"
      - ".github/workflows/timdr-archive.yml"
  pull_request:
    paths:
      - "helix_pro/timdr_archive_*.py"
      - "tests/test_timdr_archive_*.py"
      - ".github/workflows/timdr-archive.yml"
  workflow_dispatch:

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Run HTO2 / HTO3 / HTO4 / sampled AUTO regression tests
        run: |
          python -m pytest -q \
            tests/test_timdr_archive_hto2.py \
            tests/test_timdr_archive_hto3.py \
            tests/test_timdr_archive_hto4.py \
            tests/test_timdr_archive_fast.py \
            tests/test_timdr_archive_cipher.py

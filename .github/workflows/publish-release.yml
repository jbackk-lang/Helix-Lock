name: Build and publish Helix-Lock desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: HelixLock-linux
          # Match the Intel architecture used by desktop build validation.
          - os: macos-15-intel
            artifact: HelixLock-macos
          - os: windows-latest
            artifact: HelixLock-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip cryptography pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --name HelixLock helix_lock_app.py
      - name: Package application
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip ../HelixLock-windows.zip HelixLock
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent HelixLock.app ../HelixLock-macos.zip
          else
            tar -czf ../HelixLock-linux.tar.gz HelixLock
          fi
      - name: Record build environment
        shell: bash
        run: |
          python --version > build-environment.txt
          python -m pip freeze --all >> build-environment.txt
          echo "runner_os=${{ runner.os }}" >> build-environment.txt
          echo "runner_arch=$(uname -m)" >> build-environment.txt
          echo "source_commit=${{ github.sha }}" >> build-environment.txt
          echo "release_ref=${{ github.ref }}" >> build-environment.txt
      - name: Upload platform package and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            HelixLock-windows.zip
            HelixLock-macos.zip
            HelixLock-linux.tar.gz
            build-environment.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cp release-assets/HelixLock-windows/HelixLock-windows.zip publish/
          cp release-assets/HelixLock-macos/HelixLock-macos.zip publish/
          cp release-assets/HelixLock-linux/HelixLock-linux.tar.gz publish/
          cd publish
          test -s HelixLock-windows.zip
          test -s HelixLock-macos.zip
          test -s HelixLock-linux.tar.gz
          sha256sum HelixLock-windows.zip HelixLock-macos.zip HelixLock-linux.tar.gz > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Helix-Lock ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            publish/HelixLock-windows.zip
            publish/HelixLock-macos.zip
            publish/HelixLock-linux.tar.gz
            publish/SHA256SUMS.txt

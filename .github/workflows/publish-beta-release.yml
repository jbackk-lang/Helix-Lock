name: Publish Helix-Lock beta release

on:
  workflow_run:
    workflows: ["Helix-Lock desktop build validation"]
    types: [completed]
    branches: [experiment/helix-native]

permissions:
  actions: read
  contents: write

jobs:
  publish-beta:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          name: HelixLock-windows
          path: release-assets/windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          name: HelixLock-macos
          path: release-assets/macos
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          name: HelixLock-linux
          path: release-assets/linux
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp release-assets/windows/HelixLock-windows.zip release/
          cp release-assets/macos/HelixLock-macos.zip release/
          cp release-assets/linux/HelixLock-linux.tar.gz release/
          cat release-assets/windows/SHA256SUMS.txt release-assets/macos/SHA256SUMS.txt release-assets/linux/SHA256SUMS.txt > release/SHA256SUMS-builds.txt
          cat > release/TESTING.txt <<'EOF'
          HELIX-LOCK BETA — TEST BUILD
          Built from experiment/helix-native.
          This is a beta test build, not a stable production release or an independent security audit.
          Test only with copies of files and keep independent backups.
          Report bugs and compatibility issues through GitHub Issues.
          EOF
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-beta.1
          name: Helix-Lock v0.1.1 Beta 1
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          make_latest: false
          body: |
            ## Helix-Lock v0.1.1 — public beta test

            This is a practical beta build for external user testing, not a stable production release or an independent security audit.

            **Downloads**
            - Windows x64: HelixLock-windows.zip
            - macOS: HelixLock-macos.zip
            - Linux: HelixLock-linux.tar.gz

            Test only with copies of files. Keep independent backups. Please report bugs and compatibility issues in GitHub Issues.

            SHA-256 checksums and build metadata are attached where available.
          files: |
            release/HelixLock-windows.zip
            release/HelixLock-macos.zip
            release/HelixLock-linux.tar.gz
            release/SHA256SUMS-builds.txt
            release/TESTING.txt

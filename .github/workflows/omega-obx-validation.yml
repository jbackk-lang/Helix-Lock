name: Omega OBX1 and HLOB validation

on:
  push:
    paths:
      - "experiments/omega_block_codec.py"
      - "helix_pro/timdr_obx_cipher.py"
      - "helix_pro/timdr_archive_*.py"
      - "benchmarks/omega_fixture_corpus.py"
      - "benchmarks/summarize_hlob_hlom.py"
      - "benchmarks/omega_block_files.py"
      - "benchmarks/compare_hlob_hlom.py"
      - "benchmarks/profile_obx_modes.py"
      - "tests/test_omega_block*.py"
      - "tests/test_omega_sub_compatibility.py"
      - "tests/test_timdr_obx_cipher.py"
      - "tests/test_compare_hlob_hlom.py"
      - "tests/test_omega_fixture_corpus.py"
      - "tests/test_summarize_hlob_hlom.py"
      - ".github/workflows/omega-obx-validation.yml"
  pull_request:
    paths:
      - "experiments/omega_block_codec.py"
      - "helix_pro/timdr_obx_cipher.py"
      - "helix_pro/timdr_archive_*.py"
      - "benchmarks/omega_block_files.py"
      - "benchmarks/compare_hlob_hlom.py"
      - "tests/test_omega_block*.py"
      - "tests/test_omega_sub_compatibility.py"
      - "tests/test_timdr_obx_cipher.py"
      - "tests/test_compare_hlob_hlom.py"
      - ".github/workflows/omega-obx-validation.yml"
  workflow_dispatch:

jobs:
  obx-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Run block codec, envelope, and encrypted-comparison regressions
        run: |
          python -m pytest -q \
            tests/test_omega_block_codec.py \
            tests/test_omega_block_codec_hardening.py \
            tests/test_omega_sub_compatibility.py \
            tests/test_omega_block_files.py \
            tests/test_timdr_obx_cipher.py \
            tests/test_compare_hlob_hlom.py \
            tests/test_omega_fixture_corpus.py \
            tests/test_summarize_hlob_hlom.py
      - name: Compare HLOB and HLOM on deterministic CI fixtures
        run: |
          python -m benchmarks.omega_fixture_corpus --directory omega-ci-corpus --size 32768 --seed 42 > omega-ci-corpus-generation.json
          python -m benchmarks.compare_hlob_hlom omega-ci-corpus/*.bin --repeats 2 --output omega-ci-results.json
      - name: Summarize verified measurements
        run: python -m benchmarks.summarize_hlob_hlom omega-ci-results.json --output omega-ci-summary.md
      - name: Upload reproducible comparison output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-comparison-py${{ matrix.python-version }}
          path: |
            omega-ci-results.json
            omega-ci-summary.md
            omega-ci-corpus/manifest.json
          if-no-files-found: ignore

  omega-medium-benchmark:
    name: Omega 1 MiB benchmark (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Generate deterministic 1 MiB corpus
        run: |
          python -m benchmarks.omega_fixture_corpus --directory omega-medium-corpus --size 1048576 --seed 42 > omega-medium-corpus-generation.json
      - name: Benchmark three representative workloads
        run: |
          python -m benchmarks.compare_hlob_hlom \
            omega-medium-corpus/random.bin \
            omega-medium-corpus/periodic.bin \
            omega-medium-corpus/gradient.bin \
            --repeats 1 --output omega-medium-results.json > /dev/null
      - name: Summarize verified measurements
        run: python -m benchmarks.summarize_hlob_hlom omega-medium-results.json --output omega-medium-summary.md
      - name: Upload 1 MiB benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-medium-1mib-py3.12
          path: |
            omega-medium-results.json
            omega-medium-summary.md
            omega-medium-corpus/manifest.json
          if-no-files-found: ignore

  omega-obx-profile:
    name: Profile OBX1 modes (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile OBX1 transforms and zlib
        run: python -m benchmarks.profile_obx_modes --size 1048576 --repeats 3 --output obx-profile.json > /dev/null
      - name: Upload mode profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-obx-mode-profile-py3.12
          path: obx-profile.json
          if-no-files-found: error

name: Omega OBX1 and HLOB validation

on:
  push:
    paths:
      - "experiments/omega_block_codec.py"
      - "helix_pro/timdr_obx_cipher.py"
      - "helix_pro/timdr_archive_*.py"
      - "benchmarks/omega_fixture_corpus.py"
      - "benchmarks/omega_block_files.py"
      - "benchmarks/compare_hlob_hlom.py"
      - "tests/test_omega_block*.py"
      - "tests/test_timdr_obx_cipher.py"
      - "tests/test_compare_hlob_hlom.py"
      - "tests/test_omega_fixture_corpus.py"
      - ".github/workflows/omega-obx-validation.yml"
  pull_request:
    paths:
      - "experiments/omega_block_codec.py"
      - "helix_pro/timdr_obx_cipher.py"
      - "helix_pro/timdr_archive_*.py"
      - "benchmarks/omega_block_files.py"
      - "benchmarks/compare_hlob_hlom.py"
      - "tests/test_omega_block*.py"
      - "tests/test_timdr_obx_cipher.py"
      - "tests/test_compare_hlob_hlom.py"
      - ".github/workflows/omega-obx-validation.yml"
  workflow_dispatch:

jobs:
  obx-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Run block codec, envelope, and encrypted-comparison regressions
        run: |
          python -m pytest -q \
            tests/test_omega_block_codec.py \
            tests/test_omega_block_codec_hardening.py \
            tests/test_omega_block_files.py \
            tests/test_timdr_obx_cipher.py \
            tests/test_compare_hlob_hlom.py \
            tests/test_omega_fixture_corpus.py
      - name: Compare HLOB and HLOM on deterministic CI fixtures
        run: |
          python -m benchmarks.omega_fixture_corpus --directory omega-ci-corpus --size 32768 --seed 42 > omega-ci-corpus-generation.json
          python -m benchmarks.compare_hlob_hlom omega-ci-corpus/*.bin --repeats 2 --output omega-ci-results.json
      - name: Upload reproducible comparison output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-comparison-py${{ matrix.python-version }}
          path: |
            omega-ci-results.json
            omega-ci-corpus/manifest.json
          if-no-files-found: ignore

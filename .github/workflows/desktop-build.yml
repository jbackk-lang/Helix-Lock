name: Helix-Lock desktop build validation

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/helix-native]
    paths:
      - "helix_lock_app.py"
      - "helix_pro/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "helix_lock_app.py"
      - "helix_pro/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: HelixLock-linux
          - os: macos-latest
            artifact: HelixLock-macos
          - os: windows-latest
            artifact: HelixLock-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip cryptography pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --name HelixLock helix_lock_app.py
      - name: Package application
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip ../HelixLock-windows.zip HelixLock
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent HelixLock.app ../HelixLock-macos.zip
          else
            tar -czf ../HelixLock-linux.tar.gz HelixLock
          fi
      - name: Record build environment
        shell: bash
        run: |
          python --version > build-environment.txt
          python -m pip freeze --all >> build-environment.txt
          echo "runner_os=${{ runner.os }}" >> build-environment.txt
          echo "runner_arch=$(uname -m)" >> build-environment.txt
          echo "source_commit=${{ github.sha }}" >> build-environment.txt
      - name: Generate SHA-256 manifest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          files = sorted(
              p for p in Path(".").iterdir()
              if p.is_file() and (p.name.startswith("HelixLock-") or p.name == "build-environment.txt")
          )
          if not files:
              raise SystemExit("No package or build metadata found to hash")
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload platform package and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            HelixLock-windows.zip
            HelixLock-macos.zip
            HelixLock-linux.tar.gz
            build-environment.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

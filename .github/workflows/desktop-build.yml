name: Helix-Lock desktop build validation

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/helix-native]
    paths:
      - "helix_lock_app.py"
      - "helix_pro/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "helix_lock_app.py"
      - "helix_pro/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: HelixLock-linux
          - os: macos-latest
            artifact: HelixLock-macos
          - os: windows-latest
            artifact: HelixLock-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip cryptography pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --name HelixLock helix_lock_app.py
      - name: Package application
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip ../HelixLock-windows.zip HelixLock
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent HelixLock.app ../HelixLock-macos.zip
          else
            tar -czf ../HelixLock-linux.tar.gz HelixLock
          fi
      - name: Record build environment
        shell: bash
        run: |
          python --version > build-environment.txt
          python -m pip freeze --all >> build-environment.txt
          echo "runner_os=${{ runner.os }}" >> build-environment.txt
          echo "runner_arch=$(uname -m)" >> build-environment.txt
          echo "source_commit=${{ github.sha }}" >> build-environment.txt
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          files = sorted(
              p for p in Path(".").iterdir()
              if p.is_file() and (p.name.startswith("HelixLock-") or p.name == "build-environment.txt")
          )
          if not files:
              raise SystemExit("No package or build metadata found to hash")
          lines = []
          for path in files:
              hasher = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(chunk)
              lines.append(f"{hasher.hexdigest()}  {path.name}")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload platform package and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            HelixLock-windows.zip
            HelixLock-macos.zip
            HelixLock-linux.tar.gz
            build-environment.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-beta:
    name: Publish beta release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: HelixLock-windows
          path: release-assets/windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: HelixLock-macos
          path: release-assets/macos
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: HelixLock-linux
          path: release-assets/linux
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp release-assets/windows/HelixLock-windows.zip release/
          cp release-assets/macos/HelixLock-macos.zip release/
          cp release-assets/linux/HelixLock-linux.tar.gz release/
          cat release-assets/windows/SHA256SUMS.txt release-assets/macos/SHA256SUMS.txt release-assets/linux/SHA256SUMS.txt > release/SHA256SUMS-builds.txt
          cat > release/TESTING.txt <<'EOF'
          HELIX-LOCK BETA — TEST BUILD
          This is a beta test build, not a stable production release or an independent security audit.
          Test only with copies of files and keep independent backups.
          Report bugs and compatibility issues through GitHub Issues.
          EOF
      - name: Publish GitHub beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-beta.1
          name: Helix-Lock v0.1.1 Beta 1
          prerelease: true
          make_latest: false
          body: |
            ## Helix-Lock v0.1.1 — public beta test

            This is a practical beta build for external user testing, not a stable production release or an independent security audit.

            **Downloads**
            - Windows x64: HelixLock-windows.zip
            - macOS: HelixLock-macos.zip
            - Linux: HelixLock-linux.tar.gz

            Test only with copies of files. Keep independent backups. Please report bugs and compatibility issues in GitHub Issues.

            SHA-256 checksums and build metadata are attached.
          files: |
            release/HelixLock-windows.zip
            release/HelixLock-macos.zip
            release/HelixLock-linux.tar.gz
            release/SHA256SUMS-builds.txt
            release/TESTING.txt
